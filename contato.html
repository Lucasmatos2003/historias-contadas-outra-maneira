<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato | Histórias Contadas de Outra Maneira</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="brand-row">
          <div class="brand-mark">H</div>
          <div>
            <p class="eyebrow">Revista digital</p>
            <h1>Histórias Contadas de Outra Maneira</h1>
          </div>
        </div>
        <nav class="main-nav" aria-label="Navegação principal">
          <a href="index.html">Home</a>
          <a href="categoria-historia-alternativa.html">História Alternativa</a>
          <a href="categoria-curiosidades-geradas.html">Curiosidades Geradas</a>
          <a href="sobre.html">Sobre</a>
          <a href="contato.html" class="active">Contato</a>
        </nav>
      </header>

      <main class="container single-page contact-page">
        <section class="contact-card">
          <div>
            <p class="eyebrow">Contato</p>
            <h2>Parcerias, sugestões e mensagens dos leitores</h2>
          </div>

          <form class="contact-form">
            <label>
              Nome
              <input type="text" name="nome" placeholder="Seu nome" />
            </label>
            <label>
              E-mail
              <input type="email" name="email" placeholder="Seu e-mail" />
            </label>
            <label>
              Mensagem
              <textarea name="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea>
            </label>
            <button type="submit" class="button button-primary">Enviar mensagem</button>
          </form>
        </section>
      </main>

      <footer class="site-footer">
        <p>© <span id="year"></span> Histórias Contadas de Outra Maneira</p>
      </footer>
    </div>

    <script src="assets/js/main.js"></script>
  </body>
</html>
